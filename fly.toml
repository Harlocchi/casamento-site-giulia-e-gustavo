# Fly.io — 1 app, 1 máquina. Tem que bater com o app criado no `fly launch`.
app = "casamento-site-giulia-e-gustavo"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"

# Só variáveis públicas/não sensíveis aqui. Os SEGREDOS vão por
#   fly secrets set DATABASE_URL=... ABACATEPAY_API_KEY=... ABACATEPAY_WEBHOOK_SECRET=... ADMIN_TOKEN=... SITE_URL=...
[env]
  PORT = "8080"
  # "disable" = o Postgres atual (db-dev.usetracko.com) não tem TLS.
  # Se trocar por um banco gerenciado (Neon/Supabase/Fly PG), volte para "require".
  DATABASE_SSL = "disable"
  ABACATEPAY_DEV = "0" # 1 aceitaria webhook sem assinatura — nunca em produção

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # "suspend" = congela a RAM quando ocioso e volta em ~200ms no próximo request
  # (inclusive o webhook da AbacatePay). Troque por  false  + min_machines_running = 1
  # se quiser 0 cold start (aí custa ~US$2/mês).
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
