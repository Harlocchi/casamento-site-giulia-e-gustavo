  /* Vídeo do hero — os noivos (fundo já removido no .webm) atravessam a tela,

    48%  { transform: translate(calc(-100% - 50vw), -33%) scaleX(1); }
    /* fora de vista: espelha pra caminhar pra direita de frente */
    52%  { transform: translate(calc(-100% - 50vw), -33%) scaleX(-1); }

  /* Liquid glass — camadas: card + tint (::before) + blur/distorção (::after) */
  .liquid-glass {
    position: relative;
    isolation: isolate;
    width: fit-content;
    max-width: 100%;
    border-radius: 28px;
    padding: clamp(1.75rem, 5vw, 3.25rem) clamp(1.5rem, 6vw, 3.5rem);
    box-shadow: 0 0 21px -8px rgba(255, 255, 255, 0.3),
      0 30px 60px -30px rgba(0, 0, 0, 0.45);
  }
  /* tint + brilho interno */
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    background-color: color-mix(in srgb, var(--bg) 8%, transparent);
    box-shadow: inset 0 0 12px -4px rgba(255, 255, 255, 0.7),
      inset 0 1px 1px rgba(255, 255, 255, 0.25);
    pointer-events: none;
  }
  /* backdrop blur + refração do que está atrás */
  .liquid-glass::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
    -webkit-filter: url(#glass-distortion);
    filter: url(#glass-distortion);
    isolation: isolate;
    pointer-events: none;
  }
  .liquid-glass > * {
    position: relative;
    z-index: 1;
  }
  @media (prefers-reduced-motion: reduce) {
    .liquid-glass::after { filter: none; -webkit-filter: none; }
  }

  /* ---------- Portão: envelope + selo de cera (fase 1) ---------- */
  .gate {

    z-index: 100;

    padding: clamp(1rem, 5vw, 2.5rem);

  .gate-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    animation: reveal 0.7s ease both;
  }

  .envelope {
    position: relative;
    width: min(84vw, 460px);
    aspect-ratio: 7 / 5;
    perspective: 1100px;
    --paper: color-mix(in srgb, #efe7d6 84%, var(--accent));
    filter: drop-shadow(0 28px 44px rgba(0, 0, 0, 0.38));
  }
  .envelope-body {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: var(--paper);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07);
  }
  .envelope-body::before,
  .envelope-body::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
  }
  /* abas laterais/inferior do envelope */
  .envelope-body::before {
    background:
      linear-gradient(46deg, transparent 49.4%, color-mix(in srgb, var(--paper) 82%, #000) 49.6%, color-mix(in srgb, var(--paper) 82%, #000) 50.4%, transparent 50.6%),
      linear-gradient(-46deg, transparent 49.4%, color-mix(in srgb, var(--paper) 82%, #000) 49.6%, color-mix(in srgb, var(--paper) 82%, #000) 50.4%, transparent 50.6%);
  }
  .envelope-flap {
    position: absolute;
    left: -1px;
    right: -1px;
    top: 0;
    height: 62%;
    background: color-mix(in srgb, var(--paper) 90%, #000);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    z-index: 3;
  }
  .wax-seal {
    position: absolute;
    left: 50%;
    top: 62%;
    width: clamp(62px, 15vw, 88px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 0;
    padding: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: color-mix(in srgb, var(--accent) 30%, #1a1206);
    border-radius: 46% 54% 53% 47% / 52% 46% 54% 48%;
    background:
      radial-gradient(circle at 33% 28%,
        color-mix(in srgb, var(--accent) 78%, #fff) 0%,
        color-mix(in srgb, var(--accent) 92%, #000) 38%,
        color-mix(in srgb, var(--accent) 55%, #2a1c08) 100%);
    box-shadow:
      inset 0 3px 5px rgba(255, 255, 255, 0.45),
      inset 0 -6px 10px rgba(0, 0, 0, 0.45),
      inset 0 0 0 4px color-mix(in srgb, var(--accent) 65%, #2a1c08),
      0 8px 16px rgba(0, 0, 0, 0.35);
    z-index: 4;
    transition: transform 0.2s ease, filter 0.2s ease;
    animation: seal-pulse 2.8s ease-in-out infinite;
  }
  /* respingo irregular da cera, atrás do disco */
  .wax-seal::before {
    content: "";
    position: absolute;
    inset: -9px -7px -6px -8px;
    z-index: -1;
    border-radius: 42% 58% 63% 37% / 55% 48% 52% 45%;
    background: color-mix(in srgb, var(--accent) 62%, #2a1c08);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);

  .wax-seal:hover { transform: translate(-50%, -50%) scale(1.05); filter: brightness(1.06); animation: none; }
  .wax-seal:active { transform: translate(-50%, -50%) scale(0.97); }
  @keyframes seal-pulse {
    0%, 100% { box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -4px 7px rgba(0,0,0,0.38), 0 6px 14px rgba(0,0,0,0.32), 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); }
    50%      { box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -4px 7px rgba(0,0,0,0.38), 0 6px 14px rgba(0,0,0,0.32), 0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent); }
  }

  /* estado abrindo */
  .gate.abrindo { animation: gate-out 0.6s 0.55s cubic-bezier(0.4, 0, 1, 1) forwards; }
  .gate.abrindo .envelope-flap { transform: rotateX(-172deg); }
  .gate.abrindo .wax-seal {

  @keyframes gate-out {

  @media (prefers-reduced-motion: reduce) {

    .gate.abrindo, .gate.abrindo .envelope-flap, .gate.abrindo .wax-seal { animation: none; transition: none; opacity: 0; }
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>

/* ---- Pagamento (via backend + AbacatePay) ----
 * O front pede ao servidor Node (pasta server/) um link de checkout da
 * AbacatePay e redireciona o convidado pra lá. A tela de pagamento
 * (PIX + cartão parcelado) é hospedada pela AbacatePay. O servidor é o
 * único que conhece a chave secreta.
 */
async function gerarLinkDePagamento(cota) {
  const res = await fetch("/api/checkout/create", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cotaId: cota.id, valor: cota.valor }),
  });
  if (!res.ok) {
    const { error } = await res.json().catch(() => ({}));
    throw new Error(error || "Falha ao gerar o link (" + res.status + ")");
  }
  return res.json(); // { id, url }
}

 *  Tema
 * ------------------------------------------------------------------ */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try {
      return localStorage.getItem("mr-theme");
    } catch (e) {
      return null;
    }
  });

  useEffect(() => {
    const root = document.documentElement;
    if (theme === "light" || theme === "dark") {
      root.setAttribute("data-theme", theme);
    } else {
      root.removeAttribute("data-theme");
    }
    try {
      if (theme) localStorage.setItem("mr-theme", theme);
      else localStorage.removeItem("mr-theme");
    } catch (e) {}
  }, [theme]);

  const toggle = () => {
    const prefersDark =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;
    const current = theme || (prefersDark ? "dark" : "light");
    setTheme(current === "dark" ? "light" : "dark");
  };

  return { theme, toggle };
}

/* ------------------------------------------------------------------ *
 *  Contagem regressiva
 * ------------------------------------------------------------------ */
function useCountdown(targetISO) {
  const target = new Date(targetISO).getTime();
  const calc = () => {
    const diff = target - Date.now();
    if (diff <= 0) return { done: true, d: 0, h: 0, m: 0, s: 0 };
    return {
      done: false,
      d: Math.floor(diff / 86400000),
      h: Math.floor(diff / 3600000) % 24,
      m: Math.floor(diff / 60000) % 60,
      s: Math.floor(diff / 1000) % 60,
    };
  };
  const [t, setT] = useState(calc);
  useEffect(() => {
    const id = setInterval(() => setT(calc()), 1000);
    return () => clearInterval(id);
  }, [targetISO]);
  return t;
}

function GiftCard({ cota, onPick, seed, carregando }) {
  // Ordem de tentativa da imagem do card:
  //   1. cota.foto  (o arquivo em fotos/<...>, definido em cada cota)
  //   2. uma foto por palavra-chave (loremflickr) — só de reserva, p/ cotas sem foto
  //   3. o emoji sobre o fundo verde oliva
  const candidates = React.useMemo(() => {
    const list = [];
    if (cota.foto) list.push(cota.foto);
    list.push(
      "https://loremflickr.com/600/450/" +
        encodeURIComponent(cota.query) +
        "?lock=" +
        seed
    );
    return list;
  }, [cota, seed]);

  const [idx, setIdx] = useState(0);
  const src = candidates[idx];

  return (
    <div className="card overflow-hidden !gap-0 !p-0">
      <div className="gift-img">
        <span className="gift-emoji" aria-hidden="true">{cota.emoji}</span>
        {src && (
          <img
            key={src}
            src={src}
            alt={cota.titulo}
            loading="lazy"
            className="gift-photo"
            onError={() => setIdx((i) => i + 1)}
          />
        )}
      </div>
      <div className="flex flex-1 flex-col gap-2 p-5">
        <p className="font-display text-lg leading-snug" style={{ fontWeight: 400 }}>
          {cota.titulo}
        </p>
        <p className="text-sm leading-relaxed text-muted">{cota.desc}</p>
        <div className="mt-auto flex items-center justify-between gap-3 pt-3">
          <span className="font-display text-base tabular-nums" style={{ fontWeight: 500 }}>
            {brl(cota.valor)}
          </span>
          <button
            onClick={() => onPick(cota)}
            disabled={carregando}
            className="btn btn-primary"
            style={{ padding: "0.6rem 1rem", minWidth: "6.6rem" }}
          >
            {carregando ? <span className="spin" style={{ width: 15, height: 15 }} /> : "Presentear"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Overlay({ onClose, children }) {
  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = prev;
    };
  }, [onClose]);

  return (
    <div
      onMouseDown={(e) => e.target === e.currentTarget && onClose()}
      className="fixed inset-0 z-50 grid place-items-center p-4"
      style={{
        background: "color-mix(in srgb, var(--ink) 42%, transparent)",
        backdropFilter: "blur(4px)",
      }}
    >
      <div
        role="dialog"
        aria-modal="true"
        className="reveal w-full max-w-[420px] rounded-3xl border border-line bg-bg p-6 sm:p-7"
        style={{ animationDuration: "0.28s" }}
      >
        {children}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ *
 *  Portão do convite (fase 1) — só entra quem tem um código válido
 * ------------------------------------------------------------------ */
async function validarConvite(code) {
  const c = String(code || "").trim().toUpperCase();
  if (c.length < 4) throw new Error("Digite o código do seu convite.");
  try {
    const res = await fetch("/api/guests/" + encodeURIComponent(c));
    if (res.ok) return res.json();
    if (res.status === 404)
      throw new Error("Código não encontrado. Confira o seu convite.");
    throw new Error("Não consegui validar agora. Tente de novo em instantes.");
  } catch (e) {
    // ambiente de prévia (sem backend): libera só com o código de demonstração
    if (e instanceof TypeError && c === "GGDEMO")
      return { name: "Convidado", qrcode: c };
    throw e;
  }
}

// o QR pode ser só o código ou uma URL tipo .../convite?code=XXXX
function extrairCodigo(texto) {
  const s = String(texto || "").trim();
  const m = s.match(/[?&](?:code|codigo|c)=([A-Za-z0-9]+)/i);
  if (m) return m[1];
  return (s.split(/[/?#]/).filter(Boolean).pop() || s).toUpperCase();
}

function EnvelopeGate({ onOpen }) {
  const [aberto, setAberto] = useState(false);
  const [codigo, setCodigo] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState("");
  const [abrindo, setAbrindo] = useState(false);
  const [scan, setScan] = useState(false);
  const qrRef = useRef(null);

  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      document.body.style.overflow = prev;
    };
  }, []);

  const pararScan = useCallback(() => {
    setScan(false);
    const inst = qrRef.current;
    qrRef.current = null;
    if (inst) inst.stop().then(() => inst.clear()).catch(() => {});
  }, []);

  useEffect(() => () => pararScan(), [pararScan]);

  const submeter = useCallback(
    async (valor) => {
      const code = String(valor ?? codigo).trim().toUpperCase();
      setErro("");
      setCarregando(true);
      try {
        const convidado = await validarConvite(code);
        pararScan();
        setAbrindo(true);
        setTimeout(() => onOpen(convidado), 1150);
      } catch (e) {
        setErro(e.message || "Não deu certo. Tente de novo.");
        setCarregando(false);
      }
    },
    [codigo, onOpen, pararScan]
  );

  const iniciarScan = useCallback(async () => {
    setErro("");

    const seguro =
      window.isSecureContext ||
      ["localhost", "127.0.0.1"].includes(location.hostname);
    if (!seguro) {
      setErro("A câmera só funciona em https. Digite o código do convite.");
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia || !window.Html5Qrcode) {
      setErro("Leitor de QR indisponível nesse navegador — digite o código.");
      return;
    }

    // dispara o pedido de autorização da câmera (iOS/Android) e trata a resposta
    setScan("permissao");
    try {
      const teste = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false,
      });
      teste.getTracks().forEach((t) => t.stop()); // já autorizado; o leitor reabre
    } catch (e) {
      setScan(false);
      const n = e && e.name;
      if (n === "NotAllowedError" || n === "SecurityError")
        setErro(
          "Acesso à câmera negado. Libere a câmera para este site nas configurações do navegador — ou digite o código."
        );
      else if (n === "NotFoundError" || n === "OverconstrainedError")
        setErro("Nenhuma câmera encontrada nesse aparelho. Digite o código.");
      else if (n === "NotReadableError")
        setErro("A câmera está em uso por outro app. Feche-o e tente de novo.");
      else setErro("Não consegui acessar a câmera. Digite o código.");
      return;
    }

    setScan(true);
    setTimeout(async () => {
      try {
        const inst = new window.Html5Qrcode("qr-reader", { verbose: false });
        qrRef.current = inst;
        await inst.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (texto) => {
            pararScan();
            submeter(extrairCodigo(texto));
          },
          () => {}
        );
      } catch (e) {
        setScan(false);
        setErro("Não consegui iniciar a leitura. Digite o código.");
      }
    }, 50);
  }, [pararScan, submeter]);

  const fechar = () => {
    pararScan();
    setAberto(false);
    setErro("");
  };

  return (
    <div className={"gate" + (abrindo ? " abrindo" : "")}>
      <div className="gate-inner">
        <p className="eyebrow">Gustavo <span className="amp">&amp;</span> Giulia · Ourinhos</p>

        <div className="envelope">
          <div className="envelope-body" />
          <div className="envelope-flap" />
          <button
            className="wax-seal"
            onClick={() => {
              setAberto(true);
              setErro("");
            }}
            aria-label="Abrir o convite"
          >
            <Icon name="heart" className="text-[1.15rem]" />
          </button>
        </div>

        <div>
          <p className="font-display text-xl" style={{ fontWeight: 300 }}>Você está convidado</p>
          <p className="mt-1 text-sm text-muted">Toque no selo de cera para abrir o seu convite.</p>
        </div>
      </div>

      {aberto && !abrindo && (
        <Overlay onClose={fechar}>
          <div className="flex items-start justify-between gap-4">
            <div>
              <p className="eyebrow">Seu convite</p>
              <p className="font-display mt-1 text-2xl" style={{ fontWeight: 300 }}>Qual o seu código?</p>
            </div>
            <button onClick={fechar} className="grid h-8 w-8 place-items-center rounded-lg border border-line text-muted transition-colors hover:text-ink" aria-label="Fechar">
              <Icon name="x" className="text-[0.95rem]" />
            </button>
          </div>

          {scan === "permissao" ? (
            <div className="mt-6 flex flex-col items-center gap-3 py-4 text-center">
              <span className="spin" style={{ width: 24, height: 24 }} />
              <p className="text-sm text-muted">Pedindo acesso à câmera…</p>
              <p className="text-xs text-muted">Toque em <strong>Permitir</strong> quando o navegador perguntar.</p>
            </div>
          ) : scan ? (
            <div className="mt-5 flex flex-col gap-3">
              <div id="qr-reader" />
              <button onClick={pararScan} className="btn btn-ghost">Digitar o código</button>
            </div>
          ) : (
            <form onSubmit={(e) => { e.preventDefault(); submeter(); }} className="mt-5 flex flex-col gap-3">
              <input
                autoFocus
                value={codigo}
                onChange={(e) => setCodigo(e.target.value.toUpperCase().replace(/\s/g, "").slice(0, 10))}
                placeholder="XXXXXX"
                autoCapitalize="characters"
                autoComplete="off"
                spellCheck="false"
                className="rounded-lg border border-line bg-surface px-3 py-3 text-center font-display text-ink outline-none"
                style={{ letterSpacing: "0.35em", fontWeight: 400, fontSize: "1.25rem" }}
                aria-label="Código do convite"
              />
              {erro && <p className="text-sm" style={{ color: "#c2603f" }}>{erro}</p>}
              <button type="submit" disabled={carregando || codigo.length < 4} className="btn btn-primary">
                {carregando ? <span className="spin" style={{ width: 15, height: 15 }} /> : "Abrir convite"}
              </button>
              <button type="button" onClick={iniciarScan} className="flex items-center justify-center gap-2 text-xs text-muted no-underline transition-colors hover:text-ink">
                <Icon name="scan" className="text-[0.95rem]" />
                Escanear o QR code do convite
              </button>
            </form>
          )}

          <p className="mt-4 text-center text-xs text-muted">Não recebeu o código? Fale com os noivos.</p>
        </Overlay>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ *
 *  App
 * ------------------------------------------------------------------ */
function App() {
  const { theme, toggle } = useTheme();
  const [modal, setModal] = useState(null);
  const [carregandoId, setCarregandoId] = useState(null);
  const [convite, setConvite] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem("gg-convite") || "null");
    } catch (e) {
      return null;
    }
  });

  const abrirConvite = useCallback((convidado) => {
    const dados = { qrcode: convidado.qrcode, name: convidado.name };
    try {
      localStorage.setItem("gg-convite", JSON.stringify(dados));
    } catch (e) {}
    setConvite(dados);
  }, []);

  // Voltou do checkout da AbacatePay? mostra o "obrigado" e limpa a URL.
  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    if (p.has("obrigado")) {
      setModal({ type: "obrigado" });
      history.replaceState(null, "", window.location.pathname + "#presentes");
    }
  }, []);

  const openRsvp = useCallback(() => setModal({ type: "rsvp" }), []);
  const close = useCallback(() => setModal(null), []);

  const presentear = useCallback(async (cota) => {
    setCarregandoId(cota.id);
    try {
      const { url } = await gerarLinkDePagamento(cota);
      window.location.assign(url); // vai pra tela de pagamento da AbacatePay
    } catch (e) {
      setCarregandoId(null);
      alert(
        "Não foi possível abrir o pagamento agora.\n" +
          (e.message || "Tente de novo em instantes.")
      );
    }
  }, []);

  return (
    <>
      <Nav theme={theme} toggle={toggle} onRsvp={openRsvp} />
      <main>
        <Hero onRsvp={openRsvp} />
        <Countdown />
        <Venues />
        <Gifts onPick={presentear} carregandoId={carregandoId} />
      </main>
      <Footer />

      {modal?.type === "rsvp" && <RsvpModal onClose={close} />}
      {modal?.type === "obrigado" && <ObrigadoModal onClose={close} />}

      {!convite && <EnvelopeGate onOpen={abrirConvite} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
